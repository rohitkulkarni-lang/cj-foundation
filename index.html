<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>C.J. Foundation Admin Portal (Prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f2;--card:#fff;--ink:#111111;--mut:#4d4d4d;--line:#cfcfcf;--side:#111111;--sb:#e6e6e6;--acc:#f2a33a;--ok:#1d7a4d;--bad:#b3261e;--okbg:#e2f3ea;--badbg:#fbe7e5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#121212;--card:#1d1d1d;--ink:#ffffff;--mut:#cfcfcf;--line:#444444;--side:#ffffff;--sb:#181818;--okbg:#17382a;--badbg:#431d1a;color-scheme:dark}:root[data-theme="dark"] .tag.warn{background:#4a3410;color:#f5c97a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--sb);color:var(--ink);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:10px;align-items:center;padding:0 8px 18px;font-weight:700}
.logo img{width:52px;height:52px;border-radius:10px;background:#fff;padding:2px}.logo small{font-weight:400;color:var(--mut)}
aside a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink);cursor:pointer;margin-bottom:2px}
aside a.on{background:var(--card);color:var(--side);font-weight:600;box-shadow:inset 3px 0 var(--acc),0 0 0 1px var(--line)}
main{padding:22px 26px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0}h3{margin:0 0 10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stats b{display:block;font-size:24px}.stats span,.mut{color:var(--mut);font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:13px}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.pgr{justify-content:space-between}.md{max-height:none}button.p{background:var(--side);color:#fff;border-color:var(--side);font-weight:600}
button.a{background:var(--acc);color:#2b1a00;border-color:var(--acc);font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--okbg);color:var(--ok)}
.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:#fdf0d8;color:#8a5a00}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f{display:block;font-size:13px;color:var(--mut)}label.f input,label.f select{width:100%;margin-top:3px}
.msg{padding:9px 12px;border-radius:8px;margin:8px 0;font-size:14px}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.bad{background:var(--badbg);color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:start center;overflow:auto;padding:30px 12px;z-index:20}
.md{background:var(--card);border-radius:12px;padding:20px;width:min(760px,100%)}
.bars{display:grid;gap:6px}.bars div{display:flex;align-items:center;gap:8px;font-size:13px}.bars i{display:block;height:14px;border-radius:3px}
.idc{border:2px solid var(--side);border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center;max-width:380px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:30}
@media(max-width:800px){body{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:10px}.logo{padding:0 8px 0 0}aside a{white-space:nowrap;margin:0}main{padding:16px}}

button{border:1.5px solid var(--ink);color:var(--ink);background:var(--card);font-weight:600}
button.p{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
button.a{background:var(--acc);color:#111;border:1.5px solid var(--ink)}
button:hover:not(:disabled){background:var(--ink);color:var(--card)}
aside a,aside a.on{color:var(--ink)}aside a:hover{background:var(--card)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
:root[data-theme="dark"] input,:root[data-theme="dark"] select{color-scheme:dark}
</style></head><body>

function issue(){H.push({pid:found.id,ev:scanEv,cp:nextCp(),st:'Coupon issued',items:'',date:today,ib:me});go('scan');toast('Coupon issued')}
function give(){const it=[...document.querySelectorAll('.it:checked')].map(c=>c.value);if(!it.length)return toast('Select at least one item');const h=H.find(h=>h.pid==found.id&&h.ev==scanEv);h.st='Distributed';h.items=it.join(', ');h.date=today;go('scan');toast('Help recorded')}
function dform(name){modal(`<h3>Add donation</h3><p class="mut">Type an existing donor name to add to their history, or a new name to create a donor.</p><div class="g"><label class="f">Donor name<input id="d_n" list="dl" value="${name||''}"><datalist id="dl">${DN.map(d=>`<option value="${d.n}">`).join('')}</datalist></label>${fld('Aadhaar','d_a')}${fld('Phone','d_p')}${fld('Address','d_ad')}${fld('Amount (₹)','d_m','number')}${fld('Date','d_dt','date','value="'+today+'"')}<label class="f">Event<select id="d_e">${opts(E,'e2')}</select></label><label class="f">Payment mode<select id="d_md"><option>Cash</option><option>UPI</option><option>Cheque</option><option>Bank transfer</option></select></label>${fld('Upload receipt / ID proof','d_f','file')}</div><p><button class="p" onclick="saveD()">Save</button> <button onclick="close_()">Cancel</button></p>`)}
function saveD(){const n=$('#d_n').value.trim(),m=+$('#d_m').value;if(!n||!m)return toast('Enter donor name and amount');let d=DN.find(x=>x.n.toLowerCase()==n.toLowerCase());if(!d){d={id:'D'+String(DN.length+1).padStart(3,'0'),n,aad:$('#d_a').value||'—',ph:$('#d_p').value,addr:$('#d_ad').value};DN.push(d)}D.push({did:d.id,amt:m,date:$('#d_dt').value||today,ev:$('#d_e').value,md:$('#d_md').value,file:fileOf('d_f')});close_();go('donors');toast('Donation saved')}
function dview(id){const d=DN.find(x=>x.id==id),t=D.filter(x=>x.did==id).sort((a,b)=>a.date<b.date?1:-1);modal(`<h3>${d.n} <span class="mut">${d.id}</span></h3><p class="mut">Aadhaar: ${d.aad} · Phone: ${d.ph||'—'} · ${d.addr}</p><div class="stats"><div><b>${t.length}</b><span>Times donated</span></div><div><b>${money(sum(t))}</b><span>Total amount</span></div><div><b>${t[t.length-1].date}</b><span>First donation</span></div></div><h3>Donation history</h3><div class="tw"><table><tr><th>Date</th><th>Event</th><th>Mode</th><th>File</th><th>Amount</th></tr>${t.map(x=>`<tr><td>${x.date}</td><td>${en(x.ev)}</td><td>${x.md}</td><td>${x.file||'—'}</td><td>${money(x.amt)}</td></tr>`).join('')}</table></div><p><button class="p" onclick="dform('${d.n}')">+ Add donation</button> <button onclick="close_()">Close</button></p>`)}
function xform(){modal(`<h3>Add expense</h3><div class="g"><label class="f">Event<select id="x_e">${opts(E,'e2')}</select></label>${fld('Item','x_i')}<label class="f">Category<select id="x_k"><option>Food</option><option>Clothing</option><option>Transport</option><option>Other</option></select></label>${fld('Vendor','x_v')}${fld('Bill no.','x_b')}${fld('Amount (₹)','x_a','number')}${fld('Date','x_d','date','value="'+today+'"')}${fld('Upload bill / invoice','x_f','file')}</div><p><button class="p" onclick="saveX()">Save expense</button> <button onclick="close_()">Cancel</button></p>`)}
function saveX(){const i=$('#x_i').value,a=+$('#x_a').value;if(!i||!a)return toast('Enter item and amount');X.push({ev:$('#x_e').value,item:i,cat:$('#x_k').value,vendor:$('#x_v').value,bill:$('#x_b').value,amt:a,date:$('#x_d').value||today,file:fileOf('x_f')});close_();go('expenses');toast('Expense saved')}
function uform(){modal(`<h3>Add user</h3><div class="g">${fld('Full name','u_n')}${fld('Email','u_e','email')}${fld('Mobile','u_m')}<label class="f">Access level<select id="u_r"><option>Staff</option><option>Admin</option></select></label>${fld('Temporary password','u_p','password')}</div><p class="mut">Admin sees everything including amounts. Staff sees operational data only.</p><p><button class="p" onclick="saveU()">Create user</button> <button onclick="close_()">Cancel</button></p>`)}
function saveU(){const n=$('#u_n').value.trim(),e=$('#u_e').value.trim();if(!n||!e||!$('#u_p').value)return toast('Enter name, email and password');if(U.some(u=>u.email==e||u.name==n))return toast('User already exists');U.push({id:'u'+(U.length+1),name:n,email:e,mob:$('#u_m').value,role:$('#u_r').value,st:'Active',date:today});close_();$('#me').innerHTML=opts(U.map(u=>u.name),me);go('users');toast('User created')}
function togU(id){const u=U.find(x=>x.id==id);u.st=u.st=='Active'?'Inactive':'Active';go('users')}
try{const t=localStorage.getItem('cjt');if(t=='dark'){document.documentElement.dataset.theme='dark';$('#tb').textContent='☀ Light'}}catch(e){}
$('#me').innerHTML=opts(U.map(u=>u.name),me);go('people');
</script></body></html>
